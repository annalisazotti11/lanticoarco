<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="aa-root" content="../">
<title>Menu · Pizzeria L'Antico Arco, Cellamare</title>
<meta name="description" content="Il menu della Pizzeria L'Antico Arco di Cellamare: pizze gourmet e classiche, impasti bio alternativi, senza glutine e vegan, birre artigianali.">
<meta name="theme-color" content="#f4ebdf">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preload" href="../assets/fonts/inter-tight-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/css/base.css?v=f547ae7d">
<link rel="stylesheet" href="../assets/css/menu.css?v=2c49ba1b">
</head>
<body>
<a class="sr-only" href="#contenuto">Vai al menu</a>

<header class="top" id="top">
  <a class="top-logo" href="../" aria-label="L'Antico Arco Pizzeria, vai al sito"><img src="../assets/img/logo/logo-600.webp" alt="" width="600" height="388"></a>
  <div class="top-r">
    <button class="ico" type="button" id="searchBtn" aria-label="Cerca nel menu"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    <button class="ico" type="button" id="filterBtn" aria-label="Filtri" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg><span class="ico-n" id="filterCount" hidden></span></button>
  </div>
</header>

<div class="notice" id="notice" hidden></div>

<section class="intro">
  <p class="intro-k" id="status">Pizzeria L'Antico Arco, Cellamare</p>
  <h1 class="intro-t">Il menu</h1>
  <div class="searchbar" id="searchbar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    <label class="sr-only" for="q">Cerca nel menu</label>
    <input id="q" type="search" placeholder="Cerca un piatto o un ingrediente" autocomplete="off" enterkeyhint="search">
  </div>
</section>

<section class="guide" id="guide" aria-labelledby="guideT" hidden></section>
<section class="promos" id="promos" aria-label="In evidenza" hidden></section>

<section class="tiles" id="tiles" aria-label="Categorie"></section>

<nav class="gnav" id="gnav" aria-label="Categorie"><div class="gnav-in" id="gnavIn"></div></nav>

<div class="active-filters" id="activeFilters" hidden></div>

<main id="contenuto" class="menu" aria-live="polite">
  <p class="loading">Carico il menu…</p>
</main>

<footer class="mf" id="footer"></footer>

<!-- Scheda piatto -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-bg" data-close></div>
  <div class="sheet-card" tabindex="-1">
    <button class="sheet-x" type="button" data-close aria-label="Chiudi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    <div id="sheetBody"></div>
  </div>
</div>

<!-- Filtri -->
<div class="sheet" id="filters" role="dialog" aria-modal="true" aria-labelledby="filtersTitle" hidden>
  <div class="sheet-bg" data-close></div>
  <div class="sheet-card pad" tabindex="-1">
    <button class="sheet-x" type="button" data-close aria-label="Chiudi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    <h2 class="sheet-title" id="filtersTitle">Filtri</h2>
    <h3 class="f-h">Mostra solo</h3>
    <div class="chips" id="fTags"></div>
    <h3 class="f-h">Escludi i piatti con</h3>
    <div class="chips" id="fAllergens"></div>
    <p class="f-warn">Il filtro allergeni si basa sulle schede del menu: in caso di allergia chiedete sempre conferma al personale. Molte pizze si possono preparare senza glutine o senza lattosio.</p>
    <div class="f-actions">
      <button type="button" class="b-ghost" id="fReset">Azzera</button>
      <button type="button" class="b-fire" id="fApply">Mostra i piatti</button>
    </div>
  </div>
</div>

<!-- Crea la tua pizza -->
<div class="sheet" id="builder" role="dialog" aria-modal="true" aria-labelledby="bTitle" hidden>
  <div class="sheet-bg" data-close></div>
  <div class="sheet-card bld" tabindex="-1">
    <button class="sheet-x" type="button" data-close aria-label="Chiudi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    <div id="bBody"></div>
    <div class="b-foot" id="bFoot"></div>
  </div>
</div>
<!-- Da mostrare al cameriere -->
<div class="waiter" id="waiter" role="dialog" aria-modal="true" aria-labelledby="wTitle" hidden></div>
<script src="../assets/vendor/qrcode.js"></script>
<script src="../assets/js/core.js?v=e001f4eb"></script>
<script src="../assets/js/menu.js?v=a5ae59ff"></script>
</body>
</html>

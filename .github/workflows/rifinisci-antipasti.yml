name: Prepara ritagli fotografici degli antipasti

on:
  push:
    branches:
      - preparazione-foto-antipasti-20261123
    paths:
      - scripts/scontorna_antipasti.py
      - .github/workflows/rifinisci-antipasti.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scontorno:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: preparazione-foto-antipasti-20261123

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Installa strumenti di scontorno
        run: |
          python -m pip install --upgrade pip
          python -m pip install "rembg[cpu]>=2.0.64,<3" "Pillow>=10,<13"

      - name: Prepara le sette foto originali
        run: python scripts/scontorna_antipasti.py

      - name: Salva i ritagli nel branch di revisione
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/menu.json img/menu/antipasti-rifiniti/
          if ! git diff --cached --quiet; then
            git commit -m "Prepara sette antipasti con sfondo trasparente"
            git push origin HEAD:preparazione-foto-antipasti-20261123
          fi

name: Aggiorna foto Facebook e Instagram
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
concurrency:
  group: social-feed-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Leggi le pubblicazioni ufficiali
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ vars.META_PAGE_ID }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
        run: |
          if [ -z "$META_PAGE_ACCESS_TOKEN" ]; then
            echo "Collegamento Meta non ancora autorizzato. Nessun aggiornamento."
            exit 0
          fi
          node scripts/update-social-feed.mjs "$RUNNER_TEMP/social-feed.json"
      - name: Pubblica solo il feed pubblico
        run: |
          if [ ! -f "$RUNNER_TEMP/social-feed.json" ]; then exit 0; fi
          git config user.name "L'Antico Arco Social"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin social-feed >/dev/null 2>&1; then
            git fetch origin social-feed
            git switch --detach FETCH_HEAD
          else
            git switch --orphan social-feed
          fi
          cp "$RUNNER_TEMP/social-feed.json" social-feed.json
          git add social-feed.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Aggiorna feed social"
          git push origin HEAD:refs/heads/social-feed

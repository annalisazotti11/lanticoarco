<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menù V7.1 · L'Antico Arco</title><style>*{box-sizing:border-box}body{margin:0;background:#dfd2c1;color:#34251b;font:14px/1.5 system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:12px 22px;background:#fffaf4;gap:12px;flex-wrap:wrap;border-bottom:1px solid #cdbba6}strong{font:400 25px Georgia,serif}small{display:block;color:#6e5f53}.controls{display:flex;flex-wrap:wrap;gap:7px}button{font:inherit;min-height:44px;border:1px solid #cdbba6;border-radius:999px;padding:8px 16px;background:#fffaf4;color:#34251b;cursor:pointer}button[aria-pressed=true]{background:#34251b;color:#fffaf4;border-color:#34251b}button:focus-visible{outline:3px solid #934b32;outline-offset:3px}.stage{padding:12px;display:flex;justify-content:center;height:calc(100dvh - 90px);min-height:460px;overflow:auto}.screen{max-width:1440px;width:100%;height:100%;border:1px solid #cdbba6;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px #34251b20;background:#f4ebdf}.screen.phone{width:390px;max-width:100%;height:min(844px,100%);border:5px solid #34251b;border-radius:23px}.screen.totem{width:min(100%,810px);height:100%;border:5px solid #34251b;border-radius:14px}.screen iframe{border:0;width:100%;height:100%;display:block}@media(max-width:600px){header{padding:10px}.stage{height:calc(100dvh - 140px);padding:4px}button{padding:8px 12px}}</style></head><body><header><div><strong>L'Antico Arco · Menù V7.1</strong><small>Anteprima locale — nessuna modifica al sito pubblico</small></div><div class="controls"><button data-mode="pc" aria-pressed="true">Computer</button><button data-mode="phone" aria-pressed="false">Telefono</button><button data-mode="totem" aria-pressed="false">Totem touch</button><button data-mode="display" aria-pressed="false">Cartellone</button></div></header><div class="stage"><div class="screen" id="screen"><iframe id="view" title="Anteprima del menù" src="menu/index.html"></iframe></div></div><script>const screen=document.querySelector('#screen'),view=document.querySelector('#view');function mode(m){screen.className='screen '+(m==='phone'?'phone':m==='totem'||m==='display'?'totem':'');document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===m)));view.src=m==='display'?'totem/index.html':'menu/index.html'+(m==='totem'?'?totem':'')}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>mode(b.dataset.mode));if(innerWidth<640)mode('phone');</script></body></html>
